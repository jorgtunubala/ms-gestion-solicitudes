#Configurar puerto
server:
    port: ${SPRING_SERVER_SOLICITUDES_PORT}
    servlet:
        context-path: /msmaestriac


# Configuración de la base de datos
spring:
  datasource:
    #url: jdbc:mysql://dockertest.unicauca.edu.co:4207/computacion
    #username: computacion
    #password: DB-C0mput4c10N
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      auto-commit: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_OAUTH2_JWT_URI}
          audience: ${SPRING_OAUTH2_JWT_AUDIENCE}
  
  jackson:
    time-zone: "America/Bogota"
    
feign:
  client:
    config:
      default:
        connectTimeout: 50000
        readTimeout: 50000
        loggerLevel: basic

gestion-estudiantes-docentes:
  url: http://localhost:8091/api/
  resources:
    docentes-activos: docentes/listar/{estado}
    obtener-estudiante: estudiantes/informacion-personal/{correo}
    obtener-docente: docentes/obtener-docente/{identificador}
    obtener-estudiante-por-id: estudiantes/informacion-personal-estudiante/{idEstudiante}

gestion-asignaturas:
  url: http://localhost:8021/api/
  resources:
    crear-asignaturas-externas: asignaturasExternas
    obtener-asignatura: asignaturasExternas/obtener-asignatura/{idAsignatura}
    docentes-asignaturas: asignaturas/docentes-asignaturas
    asignaturas-adicionar: asignaturas/asignaturas-adicionar/{lista}

mensajeria:
  url: http://localhost:443/maestria-computacion/
  resources:
    enviar-email: mensajeria/enviar-email